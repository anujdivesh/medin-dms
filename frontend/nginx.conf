server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # -----------------------
    # Upstreams to other containers
    # -----------------------
    set $backend_upstream "backend:8000";     # backend container
    set $es_upstream "elasticsearch:9200";    # Elasticsearch container
    set $ollama_upstream "ollama:11434";      # Ollama container

    # -----------------------
    # Elasticsearch proxy
    # -----------------------
    location ^~ /dms/es/ {
        rewrite ^/dms/es/(.*)$ /$1 break;
        proxy_pass http://$es_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin "";   # bypass ES CORS
        proxy_buffering off;
    }

    # -----------------------
    # Backend API proxy
    # -----------------------
    location ^~ /dms/api/ {
        rewrite ^/dms/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
    }

    # -----------------------
    # Ollama API proxy
    # -----------------------
    location ^~ /ollama/ {
        proxy_pass http://$ollama_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
    }

    # -----------------------
    # Serve the SPA under /dms/
    # -----------------------

    # Static assets under /dms/... -> /usr/share/nginx/html/...
    location ~* ^/dms/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        rewrite ^/dms/(.*)$ /$1 break;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback for any other /dms/* route -> index.html
    location ^~ /dms/ {
        rewrite ^/dms/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # Root path (useful locally; not used behind system nginx)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -----------------------
    # Optional: gzip compression
    # -----------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # -----------------------
    # Security headers
    # -----------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}