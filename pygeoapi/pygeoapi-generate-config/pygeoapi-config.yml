resources:
  lidar:
    type: collection
    title: lidar Metadata records
    description: lidar metadata records from the DMS system
    keywords:
    - lidar
    extents:
      spatial:
        bbox:
        - -180
        - -90
        - 180
        - 90
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
    - type: record
      name: ElasticsearchCatalogue
      data: http://elastic:T2NlYW5wb3J0YWwyMDE3@elasticsearch:9200/lidar
      id_field: id
      title_field: title
  oceanography:
    type: collection
    title: Oceanography Metadata
    description: Oceanography metadata records
    keywords:
    - oceanography
    - lidar
    - observations
    - satellite imagery
    - bathymetry
    extents:
      spatial:
        bbox: [-180, -90, 180, 90]
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
    - type: record
      name: ElasticsearchCatalogue
      data: http://elastic:T2NlYW5wb3J0YWwyMDE3@elasticsearch:9200/oceanography
      id_field: id
      title_field: title
