#####################
#   ENV FOR DOCKER ##
#####################
server:
  bind:
    host: 0.0.0.0
    port: 5000
  url: https://opmthredds.gem.spc.int/dms/pygeoapi
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  gzip: false
  languages:
  - en-US
  pretty_print: true
  limits:
    default_items: 20
    max_items: 50
  map:
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap contributors</a>'
    # Overrides collections/items/index.html to drop the start/end date
    # filter from the items HTML page - see pygeoapi/templates/.
  templates:
    path: /app/templates

logging:
  level: DEBUG

metadata:
  identification:
    title: Ocean Data Management System
    description: API for accessing oceanographic metadata using Elasticsearch
    keywords:
    - oceanograhy
    - lidar
    - observations
    - satellite imagery
    - bathymetry
    keywords_type: theme
    terms_of_service: https://creativecommons.org/licenses/by/4.0/
    url: https://opmthredds.gem.spc.int/dms/pygeoapi
  license:
    name: CC-BY 4.0 license
    url: https://creativecommons.org/licenses/by/4.0/
  provider:
    name: Ocean Database
    url: https://opmthredds.gem.spc.int/dms/pygeoapi
  contact:
    name: Herve Damlamian
    position: Team Leader Ocean Prediction and Monitoring
    address: Lotus Level 2, Nabua, Suva, Fiji
    city: Suva
    stateorprovince: Central
    country: Fiji
    email: herveda@spc.int
    hours: Mo-Fr 08:00-16:30
    instructions: Available during business hours
    role: pointOfContact


